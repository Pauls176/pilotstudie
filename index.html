<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Studie – Automation Bias (Prototyp) </title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="experiment-container">

        <header class="experiment-header">
            <span id="task-counter">Aufgabe 1 von 25</span>
        </header>

        <section class="task-section" id="task-section">

            <h1 id="task-title">
                Aufgabe
            </h1>

            <div id="task-description">
                Bitte lesen Sie die Aufgabenstellung sorgfältig
                und beantworten Sie anschließend die Frage.
            </div>

            <p id="task-instruction" class="task-instruction"></p>

            <div class="answer-area">

                <div class="answer-options" id="answer-options">

                    <button
                        class="answer-button"
                        data-answer="Ja"
                    >
                        Ja
                    </button>

                    <button
                        class="answer-button"
                        data-answer="Nein"
                    >
                        Nein
                    </button>

                </div>

            </div>

        </section>

        <section class="rating-section" id="rating-section" hidden>

            <p class="rating-question">
                Wie objektiv oder subjektiv empfanden Sie die Aufgabenstellung
                "<span id="rating-group-name"></span>"?
            </p>

            <div class="rating-scale">

                <span class="rating-endpoint">objektiv</span>

                <div class="rating-options" id="rating-options">

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="1">
                        <span>1</span>
                    </label>

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="2">
                        <span>2</span>
                    </label>

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="3">
                        <span>3</span>
                    </label>

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="4">
                        <span>4</span>
                    </label>

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="5">
                        <span>5</span>
                    </label>

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="6">
                        <span>6</span>
                    </label>

                    <label class="rating-option">
                        <input type="radio" name="objectivity-rating" value="7">
                        <span>7</span>
                    </label>

                </div>

                <span class="rating-endpoint">subjektiv</span>

            </div>

            <button id="rating-submit" class="answer-button" disabled>
                Weiter
            </button>

        </section>

        <div
            id="status-message"
            class="status-message"
        ></div>

    </main>

    <script src="app.js"></script>

</body>
</html>
